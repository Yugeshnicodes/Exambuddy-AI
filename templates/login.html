<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ExamBuddy AI - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f7f8fc;

            color: #172033;
        }

        .login-container {
            width: 100%;
            max-width: 500px;

            padding: 45px 35px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #4f46e5;

            border-radius: 22px;

            font-size: 38px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 15px;

            border: 1px solid #d1d5db;

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;

            padding: 15px;

            border-radius: 12px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn {
            border: none;

            background: #4f46e5;

            color: white;

            margin-top: 8px;
        }

        .login-btn:hover {
            background: #4338ca;
        }

        .reset-btn {
            border: none;

            background: transparent;

            color: #4f46e5;

            font-size: 13px;

            padding: 10px;

            margin-top: 4px;
        }

        .reset-btn:hover {
            text-decoration: underline;
        }

        .create-btn {
            background: white;

            color: #4f46e5;

            border: 1px solid #4f46e5;

            margin-top: 8px;
        }

        .create-btn:hover {
            background: #f5f3ff;
        }

        #message {
            margin-top: 18px;

            font-size: 13px;

            color: #dc2626;

            min-height: 20px;
        }

        .footer-text {
            margin-top: 30px;

            color: #9ca3af;

            font-size: 12px;
        }

        @media (max-width: 600px) {

            .login-container {
                margin: 20px;

                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">
            🎓
        </div>


        <!-- TITLE -->

        <h1>
            ExamBuddy AI
        </h1>


        <p class="subtitle">
            Your intelligent exam preparation assistant
        </p>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

        </div>


        <!-- LOGIN BUTTON -->

        <button
            class="login-btn"
            onclick="loginUser()"
        >
            Login
        </button>


        <!-- FORGOT PASSWORD -->

        <button
            class="reset-btn"
            onclick="resetPassword()"
        >
            Forgot Password?
        </button>


        <!-- CREATE ACCOUNT -->

        <button
            class="create-btn"
            onclick="createAccount()"
        >
            Create Account
        </button>


        <!-- MESSAGE -->

        <p id="message"></p>


        <p class="footer-text">
            Study smarter. Prepare better.
        </p>


    </div>


    <!-- =====================================================
         FIREBASE
    ====================================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="{{ url_for('static', filename='login.js') }}"></script>


</body>

</html>
